# Wave 4 — ArgoCD Image Updater: rolls a project's DEV Application to the newest
# digest of a moving tag, so a push to the app repo deploys with no infra commit.
# Chart plus the per-project registrations in registrations/. Dev only, and why:
# docs/decisions.md entry 27.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.3.1
      helm:
        releaseName: argocd-image-updater
        valueFiles:
          - $values/k8s/infra-manifest/argocd-image-updater/values.yaml
    - repoURL: https://github.com/Scouterna/azure-webservices.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Scouterna/azure-webservices.git
      targetRevision: main
      path: k8s/infra-manifest/argocd-image-updater/registrations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The registrations' CRD arrives in the same sync.
      - SkipDryRunOnMissingResource=true
