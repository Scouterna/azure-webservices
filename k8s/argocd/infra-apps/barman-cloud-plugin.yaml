# Wave 1 — CloudNativePG Barman Cloud Plugin: the supported backup method for
# CNPG Postgres clusters (the classic spec.backup.barmanObjectStore is
# deprecated and removed in CNPG 1.31). Installs into cnpg-system; requires
# cert-manager (wave 0). Projects then declare an ObjectStore + reference the
# plugin in their Cluster.spec.plugins (see k8s/projects/_template).
#
# Installed from the upstream RELEASE manifest, vendored in this repo. The
# upstream kubernetes/ kustomize base ships testing images on a moving tag —
# k8s/infra-manifest/barman-cloud-plugin/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  source:
    repoURL: https://github.com/Scouterna/azure-webservices.git
    targetRevision: main
    path: k8s/infra-manifest/barman-cloud-plugin
    directory:
      # README.md sits beside the manifest; applying it would fail.
      include: 'manifest.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
