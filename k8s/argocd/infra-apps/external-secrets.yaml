# Wave 0 — External Secrets Operator (chart/operator only; the ClusterSecretStore
# and ExternalSecret CRs live in the external-secrets-config app). It sits in
# wave 0 so its CRDs and admission webhook are ready a full wave before anything
# references an ExternalSecret/ClusterSecretStore kind (config app, wave 1).
#
# Authenticates to Key Vault via Workload Identity. <ESO_CLIENT_ID> is an Azure
# identity ID, not a secret — fill it per docs/install.md §9.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.8.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/k8s/infra-manifest/external-secrets/values.yaml
        parameters:
          - name: serviceAccount.annotations.azure\.workload\.identity/client-id
            value: <ESO_CLIENT_ID>
    - repoURL: https://github.com/Scouterna/azure-webservices.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
