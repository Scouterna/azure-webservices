# Wave 2 — the shared PostgreSQL server. Wave 2 so the CNPG operator (wave 1)
# and its CRDs exist, and the ESO ClusterSecretStore (wave 1) can resolve the
# backup key from Key Vault.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Admission defaulting, not an operator, writes the drift here: the diff is
    # computed from a server-side apply dry-run so defaults are accounted for.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  source:
    repoURL: https://github.com/Scouterna/azure-webservices.git
    targetRevision: main
    # Not recursed (the default), so databases/ stays a separate app. Declaring
    # `directory.recurse: false` here instead would be dropped from the stored
    # object as a zero value, leaving infra-root permanently OutOfSync.
    path: k8s/infra-manifest/postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
