# Wave 1 — MinIO (object storage; backs Loki and Thanos only — Velero backs up to
# Azure Blob, and this is not project storage). Needs a StorageClass (wave 0).
# The minio-root secret is seeded out of band (bootstrap) or, on the real
# cluster, via an ExternalSecret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  sources:
    - repoURL: https://charts.min.io/
      chart: minio
      targetRevision: 5.4.0
      helm:
        releaseName: minio
        valueFiles:
          - $values/k8s/infra-manifest/minio/values.yaml
    - repoURL: https://github.com/Scouterna/azure-webservices.git
      targetRevision: main
      ref: values
    # ServiceMonitor as a plain manifest — see values.yaml for why not the chart's.
    - repoURL: https://github.com/Scouterna/azure-webservices.git
      targetRevision: main
      path: k8s/infra-manifest/minio
      directory:
        include: 'servicemonitor.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
