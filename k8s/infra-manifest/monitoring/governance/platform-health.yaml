# Alerts for the platform's OWN controls failing. Every one of these fails quietly
# by default: the object stays Healthy, the app stays Synced, and nothing is lost
# until someone needs it. Rationale and the scrape targets each depends on:
# docs/decisions.md entry 11.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-health
  namespace: monitoring
  labels:
    release: kps          # picked up by the kube-prometheus-stack Prometheus
spec:
  groups:
    - name: platform-controls
      # 5m, not the chart's 30s: no rule here is faster than for: 5m, so 30s
      # bought only cost. decisions.md entry 11.
      interval: 5m
      rules:
        - alert: ExternalSecretNotReady
          # A stalled ExternalSecret keeps serving the LAST synced value, so the
          # workload keeps working until a rotation or a rebuild — then does not.
          expr: |
            externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not syncing"
            description: >-
              It has been un-Ready for 15m. The Secret still holds the last value it
              fetched, so nothing has broken yet. Check the ClusterSecretStore
              conditions permit this namespace (docs/security.md §3) and that the
              key exists in the vault.

        - alert: VeleroBackupFailing
          # schedule!="" on all three Velero rules: an ad-hoc backup is run by a
          # human watching the result, and its series never updates again.
          expr: |
            increase(velero_backup_failure_total{schedule!=""}[6h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero backup schedule {{ $labels.schedule }} is failing"
            description: "A backup has failed in the last 6h. Restores are the only thing this protects, so it is invisible until one is needed."

        - alert: VeleroBackupValidationFailing
          # A rejected backup is NOT a failed backup: FailedValidation increments
          # velero_backup_validation_failure_total, which VeleroBackupFailing does
          # not watch. Nothing is written and no counter it sees moves, so a dead
          # BackupStorageLocation is invisible until VeleroNoRecentBackup's 36h.
          # Cost it 36h on 2026-09-18. decisions.md entry 11.
          expr: |
            increase(velero_backup_validation_failure_total{schedule!=""}[6h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero backup schedule {{ $labels.schedule }} is being rejected"
            description: >-
              The backup was refused before it started — usually the
              BackupStorageLocation is Unavailable. No data is reaching the
              store, and no backup-failure counter moves while this is true.

        - alert: VeleroNoRecentBackup
          # The quieter failure: not errors, just nothing running at all.
          # Unscoped, the ad-hoc series (schedule="") is frozen at its creation
          # and trips this 36h later for good — nothing ever re-runs it.
          # weekly-full needs its own threshold: 36h against a 168h cadence pages
          # for 5.5 days of every 7. The default arm stays broad so a new schedule
          # is over-alerted rather than silently unwatched. decisions.md entry 11.
          expr: |
            time() - velero_backup_last_successful_timestamp{schedule!="",schedule!="weekly-full"} > 36 * 3600
            or
            time() - velero_backup_last_successful_timestamp{schedule="weekly-full"} > 9 * 24 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "No successful Velero backup for {{ $labels.schedule }}"
            description: >-
              The schedule has not completed within its allowance — 36h for a daily
              schedule, 9 days for weekly-full. Nothing reports this except this alert.

        - alert: PostgresWALArchivingFailing
          # WAL archiving is what makes point-in-time recovery possible. A Cluster
          # can serve queries perfectly while archiving nothing. Metric name taken
          # from the cloudnative-pg dashboard, NOT the cnpg_collector_* family —
          # the collector prefix does not apply to the archiver metrics.
          expr: |
            increase(cnpg_pg_stat_archiver_failed_count[1h]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Shared Postgres is failing to archive WAL"
            description: >-
              The database is up; its backups are not. Point-in-time recovery is
              degraded for as long as this persists — see docs/maintenance.md.

        # --- Absence companions -------------------------------------------
        # Every rule above needs its series to EXIST. If the exporter stops, the
        # expression returns nothing and the alert cannot fire — silent exactly
        # when it matters. These two say "the rule above has gone blind".

        - alert: VeleroBackupMetricsAbsent
          # No backup metric at all: Velero is gone, or nothing has succeeded
          # since it started. absent() + for: 48h, not absent_over_time([48h]):
          # same detection time, ~0.1ms instead of ~10s per evaluation. Costs a
          # 48h wait on a fresh install. Scoped so the ad-hoc series cannot hold
          # it silent. decisions.md entry 11.
          expr: |
            absent(velero_backup_last_successful_timestamp{schedule!=""})
          for: 48h
          labels:
            severity: critical
          annotations:
            summary: "No Velero backup metrics — backup alerting is blind"
            description: >-
              No scheduled backup has succeeded for 48h since Velero started, or
              Velero has stopped reporting. VeleroBackupFailing and
              VeleroNoRecentBackup both need this series to exist, so neither can
              fire while this is true.

        - alert: ArgoCDMetricsAbsent
          # Either ArgoCD stopped reporting, or the ServiceMonitor selector no
          # longer matches — the upstream manifest owns those labels and can
          # change them on an ArgoCD upgrade.
          expr: |
            absent_over_time(argocd_app_info[1h])
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD has not reported app state for over an hour"
            description: >-
              ArgoCDAppNotSynced is inert while this is true, so drift is
              undetected. Check the argocd-metrics ServiceMonitor still matches
              ArgoCD's Service labels (install.md §11) before assuming ArgoCD itself
              is down.

        # --- The monitoring stack's own cost --------------------------
        # Four NodeDiskIOSaturation rounds, every one found by hand. Three were a
        # rule group out-reading the Prometheus disk; the fourth was not a rule
        # group at all, so there are two rules here. decisions.md entry 11.

        - alert: PrometheusRuleGroupExpensive
          # Sustained duty cycle, not peak: a group can dominate the disk for
          # hours while never overrunning its interval, so the chart's
          # PrometheusMissingRuleEvaluations never fires. for: 2h because
          # duration also measures disk contention: a few minutes of heavy
          # queries inflates every group, but only a truly costly group stays
          # above 1% for hours. decisions.md entry 11.
          expr: |
            avg_over_time(prometheus_rule_group_last_duration_seconds[1h])
              / prometheus_rule_group_interval_seconds > 0.01
            and
            (time() - prometheus_rule_group_last_evaluation_timestamp_seconds)
              < 2 * prometheus_rule_group_interval_seconds
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Rule group {{ $labels.rule_group }} costs {{ $value | humanizePercentage }} of wall-clock to evaluate"
            description: >-
              One rule group has spent over 1% of wall-clock evaluating for more
              than 2h, enough to load the Prometheus disk. If several groups
              fire together, look for something else holding the disk (a
              long-range dashboard or query) first. Otherwise find the rule with
              /api/v1/rules (evaluationTime per rule), then widen the group's
              interval or narrow the rule's range selector.

        - alert: ContainerDiskReadSustained
          # NodeDiskIOSaturation names a device; this names the container, the step
          # that has cost time every round. blkio, NOT container_fs_reads_bytes_total
          # — that one over-reported Prometheus 50x against both node-exporter and
          # /proc. for: 2h because investigating this cluster reads almost as hard as
          # an incident does; only the incident stays flat. decisions.md entry 11.
          expr: |
            sum by (namespace, pod, container) (
              rate(container_blkio_device_usage_total{operation="Read", container!=""}[15m])
            ) > 50e6
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has read {{ $value | humanize }}B/s from disk for 2h"
            description: >-
              One container is sustaining disk reads far above anything healthy on
              this cluster. Check its memory limit first: if working set sits just
              under the limit while oom_kill stays 0, it is refaulting page cache,
              not doing work — compare memory.current against memory.max in the
              cgroup and raise the limit. Otherwise look for a large range query
              or an unbounded scan.

        - alert: ArgoCDAppNotSynced
          # If ArgoCD stops converging, every control in this repo silently stops
          # being enforced — including the ones that self-heal drift.
          expr: |
            argocd_app_info{sync_status!="Synced"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is {{ $labels.sync_status }}"
            description: >-
              GitOps has stopped converging for this app. Anything it manages is no
              longer guaranteed to match Git, including selfHeal.
