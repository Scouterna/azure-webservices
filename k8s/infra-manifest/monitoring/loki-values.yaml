deploymentMode: SingleBinary

loki:
  # Chunks + index live in the in-cluster telemetry store's `loki` bucket (S3 API).
  # The store requires path-style addressing (s3forcepathstyle) and its own endpoint.
  # Credentials come from env vars sourced from the `loki-telemetry-store` secret
  # (see extraEnv below) — referenced here with ${VAR} interpolation.
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: http://telemetry-store.telemetry-store.svc.cluster.local:9000
      region: us-east-1            # arbitrary; the store ignores it but the client requires one
      accessKeyId: ${STORE_ACCESS_KEY_ID}
      secretAccessKey: ${STORE_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true               # in-cluster HTTP (no TLS on the internal endpoint)
  schemaConfig:
    configs:
      - from: "2026-04-24"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  commonConfig:
    replication_factor: 1
  auth_enabled: false
  # Loki defaults to retention DISABLED — chunks accumulate in the store forever.
  # The compactor enforces retention_period; delete requests go through s3.
  compactor:
    retention_enabled: true
    delete_request_store: s3
  limits_config:
    allow_structured_metadata: false
    retention_period: 744h # 31d
  # Flush chunks to object storage promptly rather than holding them in the WAL
  # for up to the 30m default — on a low-volume cluster this bounds how much
  # recent log data would be lost if the single Loki pod died before flushing.
  ingester:
    chunk_idle_period: 2m
    max_chunk_age: 10m

singleBinary:
  replicas: 1
  # Interpolate ${VAR} in the config from env (for the S3 creds), and inject the
  # store credentials from the loki-telemetry-store secret. These belong under
  # singleBinary (the single-binary pod), not the top-level loki: block.
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: STORE_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-telemetry-store
          key: accessKey
    - name: STORE_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-telemetry-store
          key: secretKey
  # Small PVC still needed for the single-binary WAL / tsdb-shipper working dir;
  # chunks + index now live in the store, so this stays modest. 16Gi = E3 tier.
  persistence:
    enabled: true
    size: 16Gi
    storageClass: disk-standardssd

write:
  replicas: 0

read:
  replicas: 0

backend:
  replicas: 0

chunksCache:
  allocatedMemory: 64
  resources:
    requests:
      cpu: 50m

resultsCache:
  allocatedMemory: 32
  resources:
    requests:
      cpu: 50m

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kps

# TOP-LEVEL in chart 18.x (not under monitoring:, where it is silently ignored
# and the canary DaemonSet deploys anyway). Alloy already ships logs; the
# write-path probe would push synthetic log lines into the store around the clock.
lokiCanary:
  enabled: false

# Must accompany lokiCanary.enabled: false — the chart's validate.yaml FAILS the
# whole render when the helm test is on without the canary, and test.enabled
# defaults to true.
test:
  enabled: false
