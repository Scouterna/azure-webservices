# Scrape the telemetry store. Written by hand rather than via the chart's
# metrics.serviceMonitor: that template also requires `includeNode`, and hardcodes
# `release: <release name>`, which our Prometheus (selector release=kps) ignores.
#
# /minio/v2/metrics/cluster answers unauthenticated; the per-node and per-bucket
# endpoints need a bearer token, so only the cluster endpoint is scraped.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telemetry-store
  namespace: telemetry-store
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      # The chart hardcodes app=minio on its Services regardless of
      # fullnameOverride, so this selector keeps the upstream label.
      app: minio
      # Excludes the console Service, which also carries app=minio but serves
      # HTML on 9001 — scraping it fails with "unsupported Content-Type text/html".
      monitoring: "true"
  endpoints:
    - port: http
      path: /minio/v2/metrics/cluster
      interval: 30s
