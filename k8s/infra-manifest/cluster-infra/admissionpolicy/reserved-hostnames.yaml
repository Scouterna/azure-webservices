# Reserve the DNS zone (ws.scouterna.net) for infra, except project territory
# (app.ws.scouterna.net). Rationale, threat and the rejected alternatives:
# docs/decisions.md entry 22. Both are filled mechanically in docs/install.md §9a.
#
# A project route must NAME a host. A route that names none matches every host,
# and router priority is tenant-settable — see the entry.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: reserved-hostnames
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
      - apiGroups: ["traefik.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingressroutes"]
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes", "gateways"]
  variables:
    # The whole delegated zone is reserved; infra's own hosts sit under
    # infra.ws.scouterna.net, so nothing here needs to know their names.
    - name: zone
      expression: "'ws.scouterna.net'"
    - name: zoneDot
      expression: "'.' + variables.zone"
    # Project territory: a sibling of infra's hosts, not a nested exception.
    - name: app
      expression: "'app.ws.scouterna.net'"
    - name: appDot
      expression: "'.' + variables.app"
  validations:
    # Every rule must name a host, and that host must be project territory or
    # outside the zone entirely (a project's own domain). defaultBackend is
    # refused outright: Traefik routes it as "all unmatched requests", which is
    # the catch-all under another name.
    - expression: >-
        request.resource.resource != 'ingresses' ||
        (has(object.spec) && !has(object.spec.defaultBackend) &&
         has(object.spec.rules) && object.spec.rules.size() > 0 &&
         object.spec.rules.all(r, has(r.host) &&
           (r.host == variables.app || r.host.endsWith(variables.appDot) ||
            !(r.host == variables.zone || r.host.endsWith(variables.zoneDot)))))
      message: "Ingress in a project namespace must name a host in every rule and must not set defaultBackend, and inside the infra zone only project territory is allowed (see docs/decisions.md entry 22)"
      messageExpression: >-
        'Ingress in a project namespace must name a host in every rule and must not ' +
        'set defaultBackend, and inside ' +
        variables.zone + ' only ' + variables.app + ' is project territory ' +
        '(see docs/decisions.md entry 22)'
    # Traefik's match is a free-form expression, so this is fail-closed: one
    # named host per route, no alternation, no negation, no regexp. A project
    # needing several hosts writes several routes.
    # Two Traefik-specific catch-alls are refused by spelling, since neither
    # names the zone: a trailing dot (the matcher retries with it stripped) and
    # a bare `*` (matches every request). docs/decisions.md entry 22.
    - expression: >-
        request.resource.resource != 'ingressroutes' ||
        (has(object.spec) && has(object.spec.routes) &&
         object.spec.routes.all(r, has(r.match) &&
           r.match.lowerAscii().contains('host(`') &&
           !r.match.lowerAscii().contains('hostregexp') &&
           !r.match.contains('||') && !r.match.contains('!') &&
           !r.match.contains('.`') && !r.match.contains('`*`') &&
           r.match.lowerAscii().split('`').all(tok,
             !(tok == variables.zone || tok.endsWith(variables.zoneDot)) ||
              (tok == variables.app || tok.endsWith(variables.appDot)))))
      message: "IngressRoute in a project namespace must match exactly one named host, without ||, ! or HostRegexp, and inside the infra zone only project territory is allowed (see docs/decisions.md entry 22)"
      messageExpression: >-
        'IngressRoute in a project namespace must match one named Host() per route ' +
        '(no ||, no !, no HostRegexp), and inside ' + variables.zone + ' only ' +
        variables.app + ' is project territory (see docs/decisions.md entry 22)'
    - expression: >-
        request.resource.resource != 'httproutes' ||
        (has(object.spec) && has(object.spec.hostnames) && object.spec.hostnames.size() > 0 &&
         object.spec.hostnames.all(h, h.lowerAscii() == variables.app ||
           h.lowerAscii().endsWith(variables.appDot) ||
           !(h.lowerAscii() == variables.zone || h.lowerAscii().endsWith(variables.zoneDot))))
      message: "HTTPRoute in a project namespace must name a hostname, and inside the infra zone only project territory is allowed (see docs/decisions.md entry 22)"
      messageExpression: >-
        'HTTPRoute in a project namespace must name at least one hostname, and inside ' +
        variables.zone + ' only ' + variables.app + ' is project territory ' +
        '(see docs/decisions.md entry 22)'
    - expression: >-
        request.resource.resource != 'gateways' ||
        (has(object.spec) && has(object.spec.listeners) &&
         object.spec.listeners.all(l, has(l.hostname) &&
           (l.hostname.lowerAscii() == variables.app ||
            l.hostname.lowerAscii().endsWith(variables.appDot) ||
            !(l.hostname.lowerAscii() == variables.zone ||
              l.hostname.lowerAscii().endsWith(variables.zoneDot)))))
      message: "Gateway listener in a project namespace must name a hostname, and inside the infra zone only project territory is allowed (see docs/decisions.md entry 22)"
      messageExpression: >-
        'every Gateway listener in a project namespace must name a hostname, and inside ' +
        variables.zone + ' only ' + variables.app + ' is project territory ' +
        '(see docs/decisions.md entry 22)'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: reserved-hostnames-projects
spec:
  policyName: reserved-hostnames
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: scouterna.se/project
          operator: Exists
