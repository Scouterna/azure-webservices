# Deny pod egress to Azure IMDS (169.254.169.254) outside kube-system.
# Rationale and the kube-system carve-out: docs/security.md.
# Verify enforcement after a rebuild — Synced does not mean enforced: install.md §11.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-imds-egress
spec:
  description: Deny egress to Azure IMDS (169.254.169.254) from all pods outside kube-system
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  # Removing this turns a targeted deny into a cluster-wide egress outage.
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
