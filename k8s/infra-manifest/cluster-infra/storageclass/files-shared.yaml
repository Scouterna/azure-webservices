apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: files-shared
provisioner: file.csi.azure.com
# Immutable: changing parameters on a live cluster needs `kubectl delete sc` — docs/decisions.md entry 23.
parameters:
  skuName: Standard_LRS
  # Account key lands here, not the tenant's namespace — docs/decisions.md entry 23.
  secretNamespace: kube-system
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=0
  - gid=0
  - mfsymlinks
  - cache=strict
  - actimeo=30
  - nosharesock
