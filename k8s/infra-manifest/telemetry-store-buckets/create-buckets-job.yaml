# Creates the buckets the platform needs in the telemetry store: loki, thanos.
# (Velero does NOT back up here — it writes to the durable external Azure Blob
# account, precisely so backups survive the cluster.)
#
# Why a standalone Job instead of the min.io chart's built-in bucket creation:
# the chart provisions buckets via a Helm `post-install` hook, which ArgoCD maps
# to a PostSync hook. That only runs after the app syncs cleanly — and on a fresh
# bring-up the store can't fully sync until its `telemetry-store-root` secret
# exists (ESO materializes it), so the hook is skipped and the buckets are never
# created. Thanos-store then crash-loops on "bucket does not exist". This Job
# makes bucket creation a first-class, ArgoCD-tracked, idempotent resource.
#
# Idempotent: `mc mb --ignore-existing` is a no-op if the bucket already exists,
# so it's safe to re-run on every sync / rebuild.
apiVersion: batch/v1
kind: Job
metadata:
  name: telemetry-store-create-buckets
  namespace: telemetry-store
spec:
  # ArgoCD manages this as a normal resource (not a hook). The completed Job is
  # left in place — ArgoCD reads Job "Complete" as Healthy and stays Synced, no
  # churn. On a rebuild it's a fresh cluster; if the spec ever changes, the app's
  # Replace=true recreates the (immutable) Job. The mc commands are idempotent
  # (`mb --ignore-existing`), so a re-run is always safe.
  backoffLimit: 10
  template:
    metadata:
      name: telemetry-store-create-buckets
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          # The store's own image ships `mc`; one pin instead of two.
          # quay.io/minio/mc no longer exists.
          image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
          env:
            - name: STORE_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: telemetry-store-root
                  key: rootUser
            - name: STORE_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetry-store-root
                  key: rootPassword
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Wait for the store to answer before creating buckets.
              until mc alias set local \
                    http://telemetry-store.telemetry-store.svc.cluster.local:9000 \
                    "$STORE_ROOT_USER" "$STORE_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for telemetry-store..."; sleep 3
              done
              for b in loki thanos; do
                mc mb --ignore-existing "local/$b"
              done
              echo "buckets ready: loki thanos"
