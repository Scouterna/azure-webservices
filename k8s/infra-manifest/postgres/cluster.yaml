# The SHARED PostgreSQL server. One instance set absorbs many small project
# databases — most projects here are low-traffic, and a dedicated Postgres per
# project would reserve far more than it uses (see docs/postgres.md).
#
# A project that genuinely needs its own instance creates a Cluster in its own
# namespace instead; nothing here prevents that.
---
# Backup storage key, materialized from Key Vault by ESO (no key committed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-storage
  namespace: postgres
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: backup-storage-key
    template:
      data:
        AZURE_STORAGE_ACCOUNT: stwsv2backup
        AZURE_STORAGE_KEY: "{{ .storageKey }}"
  data:
    - secretKey: storageKey
      remoteRef:
        key: backup-storage-account-key
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: shared-store
  namespace: postgres
spec:
  configuration:
    destinationPath: "https://stwsv2backup.blob.core.windows.net/cnpg-shared"
    azureCredentials:
      storageAccount:
        name: backup-storage-key
        key: AZURE_STORAGE_ACCOUNT
      storageKey:
        name: backup-storage-key
        key: AZURE_STORAGE_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared
  namespace: postgres
spec:
  # 1 while the cluster is single-node: a second replica lands on the same node,
  # so it is not real HA, and it costs one of the node's 12 attachable-disk slots
  # (the binding limit here — see docs/postgres.md). Raise to 2 with a 2nd node.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 32Gi                     # exact Azure SSD tier (E4). Grow by tier.
    storageClass: disk-standardssd
  # Every project database lives here, so this is sized for the sum of many
  # small ones, not for one workload.
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi
  postgresql:
    parameters:
      max_connections: "200"       # shared: many small clients
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: shared-store
  # No `bootstrap.initdb.database`: project databases are declared separately as
  # Database resources, not created here.
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: shared-daily
  namespace: postgres
spec:
  schedule: "0 30 2 * * *"         # 02:30 daily (6 fields: CNPG includes seconds)
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: shared
---
# Postgres metrics for the shared server → the cluster Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-shared
  namespace: postgres
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: shared
  podMetricsEndpoints:
    - port: metrics
