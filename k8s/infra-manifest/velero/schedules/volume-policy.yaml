# Velero volume policy, referenced by both Schedules in schedules.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-policy
  namespace: velero
data:
  policy.yaml: |
    version: v1
    volumePolicies:
      # Azure Files (files-shared) has no VolumeSnapshotClass, so a snapshot
      # attempt fails the whole backup as PartiallyFailed. Its contents are not
      # backed up by design (decisions.md entry 23); the PVC object still is.
      - conditions:
          csi:
            driver: file.csi.azure.com
        action:
          type: skip
