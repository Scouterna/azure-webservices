# Velero volume policy, referenced by both Schedules in schedules.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-policy
  namespace: velero
data:
  policy.yaml: |
    version: v1
    volumePolicies:
      # Azure Files (files-shared) has no VolumeSnapshotClass; copy its files
      # with the node-agent instead — decisions.md entry 30.
      - conditions:
          csi:
            driver: file.csi.azure.com
        action:
          type: fs-backup
