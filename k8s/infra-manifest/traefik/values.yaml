deployment:
  replicas: 1

# Enable both Ingress and Gateway API providers
providers:
  kubernetesCRD:
    enabled: true
    # Projects have admin in their own namespace; enabling this would let an
    # IngressRoute target any other namespace's Service.
    allowCrossNamespace: false
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
  kubernetesGateway:
    enabled: true

# Traefik is the default ingress class for the cluster.
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# Gateway API GatewayClass
gatewayClass:
  enabled: true
  name: traefik

# Redirect HTTP → HTTPS globally
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

service:
  # Deliberately annotation-free: AKS assigns the public IP itself.
  # ipFamilyPolicy/ipFamilies MUST sit under `spec` — set directly under
  # `service:` the chart drops them silently. Dual-stack: docs/install.md §11.
  spec:
    type: LoadBalancer
    ipFamilyPolicy: PreferDualStack
    ipFamilies:
      - IPv4
      - IPv6
    # REQUIRED on Azure Linux nodes — with `Cluster` the v6 address blackholes.
    externalTrafficPolicy: Local

# Modest resource requests/limits (single-node cluster; tune as load grows)
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    memory: 256Mi

# Ingress for the Traefik dashboard (internal only, no public exposure)
ingressRoute:
  dashboard:
    enabled: false

# Chart v41 renamed `logs:` to `log:`; `accessLog: {}` enables access logs.
log:
  level: WARN
accessLog: {}

metrics:
  prometheus:
    # Traefik is wave 1, kps (which owns the ServiceMonitor CRD) is wave 2, so
    # the CRD is absent at first sync and the render-time check would abort.
    disableAPICheck: true
    # Per-router labels give per-Ingress breakdowns in Grafana.
    addRoutersLabels: true
    # Narrower than the chart default; less quantile interpolation error.
    buckets: "0.05,0.1,0.25,0.5,0.75,1,2.5,5"
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      # REQUIRED: matches serviceMonitorSelector; without it, no metrics and
      # no error.
      additionalLabels:
        release: kps
