# Slack webhook for Alertmanager. The URL is a bearer credential — anyone holding
# it can post to the channel — so it lives in Key Vault, never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    # Mounted by the Alertmanager pod via alertmanagerSpec.secrets, and read with
    # slack_api_url_file so the URL never lands in the config Secret.
    name: alertmanager-slack
    template:
      type: Opaque
      data:
        webhook-url: "{{ .webhookUrl }}"
  data:
    - secretKey: webhookUrl
      remoteRef:
        key: alertmanager-slack-webhook-url
