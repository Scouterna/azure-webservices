# Telemetry-store secrets, materialized from Key Vault by ESO.
# These replace the first-boot hand-seeding; on a rebuild ESO recreates them
# from KV automatically. Requires in the Key Vault:
#   - telemetry-store-root-user
#   - telemetry-store-root-password
---
# Root credentials (the chart reads existingSecret `telemetry-store-root`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telemetry-store-root
  namespace: telemetry-store
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: telemetry-store-root
    creationPolicy: Owner
  data:
    - secretKey: rootUser
      remoteRef:
        key: telemetry-store-root-user
    - secretKey: rootPassword
      remoteRef:
        key: telemetry-store-root-password
---
# Loki's telemetry-store credentials (loki-values reads secret `loki-telemetry-store`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-telemetry-store
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: loki-telemetry-store
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef:
        key: telemetry-store-root-user
    - secretKey: secretKey
      remoteRef:
        key: telemetry-store-root-password
---
# Thanos objstore config for the Prometheus sidecar + Thanos components.
# The whole objstore.yml is composed by an ESO template from the KV values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: thanos-objstore
    creationPolicy: Owner
    template:
      data:
        objstore.yml: |
          type: S3
          config:
            bucket: thanos
            endpoint: telemetry-store.telemetry-store.svc.cluster.local:9000
            access_key: "{{ .accessKey }}"
            secret_key: "{{ .secretKey }}"
            insecure: true
  data:
    - secretKey: accessKey
      remoteRef:
        key: telemetry-store-root-user
    - secretKey: secretKey
      remoteRef:
        key: telemetry-store-root-password
