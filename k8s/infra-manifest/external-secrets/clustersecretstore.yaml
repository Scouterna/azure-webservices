# The single shared ClusterSecretStore. ESO authenticates via Workload Identity
# (docs/install.md §4). Every infra ExternalSecret references it by name.
#
# <KEY_VAULT_NAME> is filled per docs/install.md §9. Left unfilled, the store
# still reports Ready — validation does no live fetch — and the ExternalSecrets
# fail individually with SecretSyncedError.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://<KEY_VAULT_NAME>.vault.azure.net/
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
  # Without conditions this store is usable from EVERY namespace, and its
  # identity can read the whole vault. Adding a namespace here grants it the
  # whole vault too — there is no per-key scoping. See docs/security.md.
  conditions:
    - namespaces:
        - dex
        - headlamp
        - minio
        - monitoring
        - postgres
        - sealed-secrets
    # Project namespaces opt in per environment, when infra grants a database.
    - namespaceSelector:
        matchLabels:
          scouterna.se/keyvault-access: "true"
