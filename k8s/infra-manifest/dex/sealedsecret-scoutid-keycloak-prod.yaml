# Client secret of Dex's `scoutid-keycloak-prod` static client, shared with
# ScoutID prod Keycloak (its half: k8s/projects/proj-scoutid/infra/
# sealedsecret-dex-client-prod.yaml). Dex reads it as
# $SCOUTID_KEYCLOAK_PROD_CLIENT_SECRET (see values.yaml envVars). Reseal both
# halves together when rotating; docs/onboarding.md.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dex-scoutid-keycloak-prod
  namespace: dex
spec:
  encryptedData:
    client-secret: 
  template:
    metadata:
      name: dex-scoutid-keycloak-prod
      namespace: dex
