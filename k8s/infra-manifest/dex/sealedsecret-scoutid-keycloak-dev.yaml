# Client secret of Dex's `scoutid-keycloak-dev` static client, shared with
# ScoutID dev Keycloak (its half: k8s/projects/proj-scoutid/infra/
# sealedsecret-dex-client-dev.yaml). Dex reads it as
# $SCOUTID_KEYCLOAK_DEV_CLIENT_SECRET (see values.yaml envVars). Reseal both
# halves together when rotating; docs/onboarding.md.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dex-scoutid-keycloak-dev
  namespace: dex
spec:
  encryptedData:
    client-secret: 
  template:
    metadata:
      name: dex-scoutid-keycloak-dev
      namespace: dex
