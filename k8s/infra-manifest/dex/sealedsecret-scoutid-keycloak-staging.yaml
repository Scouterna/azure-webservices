# Client secret of Dex's `scoutid-keycloak-staging` static client, shared with
# ScoutID staging Keycloak (sealed on its side as proj-scoutid-staging/dex-client
# in scoutid-keycloak-infra). Dex reads it as $SCOUTID_KEYCLOAK_STAGING_CLIENT_SECRET
# (see values.yaml envVars). Reseal both sides together when rotating.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dex-scoutid-keycloak-staging
  namespace: dex
spec:
  encryptedData:
    client-secret: 
  template:
    metadata:
      name: dex-scoutid-keycloak-staging
      namespace: dex
