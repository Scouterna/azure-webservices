# Prod namespace for the project.
apiVersion: v1
kind: Namespace
metadata:
  name: PROJECT-prod
  labels:
    scouterna.se/project: PROJECT
    scouterna.se/env: prod
    # See namespace-dev.yaml for why these are here. Same level in both
    # environments on purpose: a pod that cannot run in dev must not first
    # succeed in prod.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
