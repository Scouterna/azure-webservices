# the recipe in docs/onboarding.md (A private repo).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: repo-proj-dj26
  namespace: argocd
spec:
  encryptedData:
    project: 
    sshPrivateKey: 
    type: 
    url: 
  template:
    metadata:
      labels:
        argocd.argoproj.io/secret-type: repository
      name: repo-proj-dj26
      namespace: argocd
