# Prod namespace for the project.
apiVersion: v1
kind: Namespace
metadata:
  name: proj-wsj27-prod
  labels:
    scouterna.se/project: proj-wsj27
    scouterna.se/env: prod
    # Same level as dev on purpose — see docs/security.md.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
