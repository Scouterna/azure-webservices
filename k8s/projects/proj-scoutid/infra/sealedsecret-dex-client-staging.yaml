# ScoutID staging Keycloak's half of the `scoutid-keycloak-staging` Dex client
# secret (Dex's half: k8s/infra-manifest/dex/sealedsecret-scoutid-keycloak-staging.yaml).
# Keycloak reads it as $DEX_CLIENT_SECRET. Reseal both halves together when
# rotating; docs/onboarding.md.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dex-client
  namespace: proj-scoutid-staging
spec:
  encryptedData:
    DEX_CLIENT_SECRET: 
  template:
    metadata:
      name: dex-client
      namespace: proj-scoutid-staging
