# Dev namespace for the project.
apiVersion: v1
kind: Namespace
metadata:
  name: proj-scoutid
  labels:
    scouterna.se/project: proj-scoutid
    # Pod Security Admission — without these the namespace is unprotected and
    # nothing reports it. Rationale: docs/security.md. Bumping enforce-version
    # after an AKS upgrade: docs/maintenance.md.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
